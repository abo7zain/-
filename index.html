<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>أجيال كلين | تنظيف ومكافحة حشرات</title>
  <meta name="description" content="أجيال كلين لخدمات التنظيف ومكافحة الحشرات في المنطقة الشرقية">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Tahoma, Arial, sans-serif;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f7faf9;
      color: #173b35;
      line-height: 1.8;
    }

    a {
      text-decoration: none;
    }

    .container {
      width: min(1120px, 92%);
      margin: auto;
    }

    /* الهيدر */
    header {
      background: rgba(255,255,255,0.96);
      position: sticky;
      top: 0;
      z-index: 1000;
      box-shadow: 0 2px 15px rgba(0,0,0,.07);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #087f6b;
      font-size: 24px;
      font-weight: 900;
    }

    .logo-icon {
      width: 45px;
      height: 45px;
      border-radius: 14px;
      background: linear-gradient(135deg,#08a889,#056b5b);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      box-shadow: 0 7px 18px rgba(8,168,137,.25);
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 25px;
    }

    .menu a {
      color: #234740;
      font-weight: 700;
      transition: .3s;
    }

    .menu a:hover {
      color: #08a889;
    }

    .header-buttons {
      display: flex;
      gap: 9px;
    }

    .btn {
      border-radius: 12px;
      padding: 11px 17px;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: .3s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .whatsapp {
      background: #19b968;
      color: white;
      box-shadow: 0 7px 18px rgba(25,185,104,.22);
    }

    .phone {
      background: #087f6b;
      color: white;
      box-shadow: 0 7px 18px rgba(8,127,107,.20);
    }

    /* البانر الرئيسي */
    .hero {
      padding: 65px 0 55px;
      background:
        radial-gradient(circle at 10% 20%, rgba(14,170,137,.12), transparent 32%),
        radial-gradient(circle at 90% 80%, rgba(7,126,107,.10), transparent 35%),
        linear-gradient(135deg,#f4fbf8,#ffffff);
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      align-items: center;
      gap: 45px;
    }

    .hero-text h1 {
      font-size: clamp(35px,5vw,58px);
      line-height: 1.25;
      color: #123e36;
      margin-bottom: 20px;
    }

    .hero-text h1 span {
      color: #08a889;
    }

    .hero-text p {
      font-size: 19px;
      color: #5c716c;
      margin-bottom: 27px;
      max-width: 570px;
    }

    .hero-buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .hero-buttons .btn {
      padding: 14px 25px;
      font-size: 16px;
    }

    .hero-image {
      min-height: 390px;
      border-radius: 35px;
      overflow: hidden;
      position: relative;
      background:
        linear-gradient(rgba(4,83,70,.10),rgba(4,83,70,.25)),
        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1200&q=85")
        center/cover;
      box-shadow: 0 25px 55px rgba(17,65,57,.18);
    }

    .hero-badge {
      position: absolute;
      right: 22px;
      bottom: 22px;
      background: rgba(255,255,255,.95);
      border-radius: 18px;
      padding: 15px 19px;
      box-shadow: 0 10px 30px rgba(0,0,0,.13);
      font-weight: 800;
      color: #14554a;
    }

    /* المميزات */
    .features {
      padding: 35px 0;
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 18px;
    }

    .feature {
      background: white;
      border-radius: 20px;
      padding: 25px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(18,61,53,.06);
      border: 1px solid #e9f1ef;
    }

    .feature-icon {
      font-size: 35px;
      margin-bottom: 10px;
    }

    .feature h3 {
      color: #14554a;
      margin-bottom: 6px;
    }

    .feature p {
      color: #71817d;
      font-size: 14px;
    }

    /* الأقسام */
    section {
      padding: 70px 0;
    }

    .section-title {
      text-align: center;
      margin-bottom: 42px;
    }

    .section-title span {
      color: #08a889;
      font-weight: 900;
      display: block;
      margin-bottom: 5px;
    }

    .section-title h2 {
      font-size: 36px;
      color: #123e36;
    }

    .section-title p {
      color: #71817d;
      margin-top: 8px;
    }

    /* الخدمات */
    .services {
      background: #eef7f4;
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 22px;
    }

    .service {
      background: white;
      border-radius: 22px;
      padding: 28px;
      border: 1px solid #e4efeb;
      box-shadow: 0 9px 30px rgba(18,61,53,.06);
      transition: .3s;
    }

    .service:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(18,61,53,.11);
    }

    .service-icon {
      width: 60px;
      height: 60px;
      border-radius: 17px;
      background: #e2f7f1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin-bottom: 17px;
    }

    .service h3 {
      color: #14554a;
      margin-bottom: 8px;
      font-size: 20px;
    }

    .service p {
      color: #71817d;
      font-size: 15px;
    }

    /* من نحن */
    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      align-items: center;
    }

    .about-box {
      background: white;
      border-radius: 28px;
      padding: 35px;
      box-shadow: 0 12px 35px rgba(18,61,53,.07);
    }

    .about-box h2 {
      font-size: 34px;
      color: #123e36;
      margin-bottom: 15px;
    }

    .about-box p {
      color: #687b76;
      margin-bottom: 15px;
    }

    .check {
      margin: 10px 0;
      font-weight: 700;
      color: #14554a;
    }

    .about-image {
      min-height: 360px;
      border-radius: 30px;
      background:
        url("https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=1000&q=80")
        center/cover;
      box-shadow: 0 20px 45px rgba(18,61,53,.15);
    }

    /* التواصل */
    .contact {
      background: linear-gradient(135deg,#087f6b,#075e51);
      color: white;
    }

    .contact-box {
      text-align: center;
      max-width: 800px;
      margin: auto;
    }

    .contact-box h2 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .contact-box p {
      opacity: .9;
      margin-bottom: 25px;
      font-size: 18px;
    }

    .contact-buttons {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .contact-buttons .btn {
      background: white;
      color: #075e51;
      min-width: 190px;
      padding: 15px 20px;
    }

    .contact-buttons .btn.whatsapp {
      background: #19b968;
      color: white;
    }

    /* الفوتر */
    footer {
      background: #083b34;
      color: white;
      text-align: center;
      padding: 25px 15px 90px;
    }

    footer p {
      opacity: .85;
      font-size: 14px;
    }

    /* أزرار الهاتف */
    .mobile-actions {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      display: none;
