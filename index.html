<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>أجيال كلين | للتنظيف ومكافحة الحشرات</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #ffffff;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
    }

    .page {
      position: relative;
      width: 100%;
      max-width: 1184px;
      margin: 0 auto;
    }

    .design {
      display: block;
      width: 100%;
      height: auto;
    }

    .button {
      position: absolute;
      display: block;
      z-index: 10;
      border-radius: 50px;
    }

    /* زر الاتصال أعلى الصفحة */
    .phone-top {
      top: 2.6%;
      right: 2.8%;
      width: 11%;
      height: 4.5%;
    }

    /* زر واتساب أعلى الصفحة */
    .whatsapp-top {
      top: 2.6%;
      right: 14.5%;
      width: 13%;
      height: 4.5%;
    }

    /* زر واتساب الرئيسي */
    .whatsapp-main {
      top: 54%;
      right: 54%;
      width: 34%;
      height: 7%;
    }

    /* زر الاتصال الرئيسي */
    .phone-main {
      top: 54%;
      left: 10%;
      width: 32%;
      height: 7%;
    }

    /* أزرار أسفل التصميم */
    .phone-bottom {
      top: 92%;
      left: 40%;
      width: 14%;
      height: 3.5%;
    }

    .whatsapp-bottom {
      top: 92%;
      left: 53%;
      width: 12%;
      height: 3.5%;
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="design"
      src="ajeal-clean-design.webp"
      alt="أجيال كلين للتنظيف ومكافحة الحشرات"
    >

    <a
      class="button phone-top"
      href="tel:0559244028"
      aria-label="اتصال"
    ></a>

    <a
      class="button whatsapp-top"
      href="https://wa.me/966559244028"
      target="_blank"
      rel="noopener"
      aria-label="واتساب"
    ></a>

    <a
      class="button whatsapp-main"
      href="https://wa.me/966559244028"
      target="_blank"
      rel="noopener"
      aria-label="تواصل معنا عبر واتساب"
    ></a>

    <a
      class="button phone-main"
      href="tel:0559244028"
      aria-label="اتصل الآن"
    ></a>

    <a
      class="button phone-bottom"
      href="tel:0559244028"
      aria-label="اتصال"
    ></a>

    <a
      class="button whatsapp-bottom"
      href="https://wa.me/966559244028"
      target="_blank"
      rel="noopener"
      aria-label="واتساب"
    ></a>

  </main>

</body>
</html>
